<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Центр</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #13131c; color: #e0e0e0; padding: 16px; padding-bottom: 100px; min-height: 100vh; background-image: radial-gradient(circle at 20% 0%, rgba(91,124,153,0.08) 0%, transparent 50%), radial-gradient(circle at 80% 100%, rgba(120,90,180,0.06) 0%, transparent 50%); }
        .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .burger { background: #1e1e2a; border: none; color: #e0e0e0; width: 42px; height: 42px; border-radius: 12px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .burger:active { background: #5B7C99; transform: scale(0.95); }
        .header { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
        .card { background: #1e1e2a; border-radius: 16px; padding: 18px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.2); position: relative; animation: fadeIn 0.3s ease; border-left: 3px solid transparent; transition: border-color 0.2s; }
        .card:hover { border-left-color: #5B7C99; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(91,124,153,0.7); } 50% { box-shadow: 0 0 0 6px rgba(91,124,153,0); } }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #fff; display: flex; align-items: center; gap: 8px; }
        .card-text { font-size: 14px; color: #b8b8c8; line-height: 1.6; }
        .card-date { font-size: 12px; color: #6a6a7a; margin-top: 10px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .empty { text-align: center; color: #6a6a7a; padding: 60px 20px; font-size: 14px; line-height: 1.8; }
        .empty svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.4; }
        .loading { text-align: center; color: #5B7C99; padding: 40px; font-size: 14px; }
        .task-done { text-decoration: line-through; opacity: 0.45; }
        .link-url { color: #6a9bc4; font-size: 13px; word-break: break-all; text-decoration: none; display: inline-block; margin-top: 4px; }
        .link-url:active { opacity: 0.7; }
        .card-actions { position: absolute; top: 14px; right: 14px; display: flex; gap: 6px; }
        .btn-icon { background: #2a2a3a; border: none; color: #b8b8c8; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
        .btn-icon svg { width: 16px; height: 16px; }
        .btn-icon:active { background: #5B7C99; color: #fff; transform: scale(0.92); }
        .fab { position: fixed; bottom: 24px; right: 24px; width: 58px; height: 58px; border-radius: 18px; background: #5B7C99; color: #fff; border: none; font-size: 26px; cursor: pointer; box-shadow: 0 0 20px rgba(91,124,153,0.6), 0 6px 20px rgba(91,124,153,0.4); display: flex; align-items: center; justify-content: center; z-index: 50; transition: all 0.2s; animation: glow 2.5s infinite; }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(91,124,153,0.6), 0 6px 20px rgba(91,124,153,0.4); } 50% { box-shadow: 0 0 30px rgba(91,124,153,0.9), 0 6px 20px rgba(91,124,153,0.5); } }
        .fab:active { transform: scale(0.92); background: #4a6b88; }
        .fab svg { width: 26px; height: 26px; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; animation: fadeIn 0.2s; backdrop-filter: blur(4px); }
        .modal-content { background: #1e1e2a; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; color: #fff; }
        .modal input, .modal textarea, .modal select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #2a2a3a; background: #13131c; color: #e0e0e0; font-size: 14px; margin-bottom: 12px; font-family: inherit; transition: border 0.2s; }
        .modal input:focus, .modal textarea:focus { outline: none; border-color: #5B7C99; }
        .modal textarea { min-height: 90px; resize: vertical; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 6px; }
        .modal-buttons button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 14px; cursor: pointer; font-weight: 600; transition: all 0.15s; }
        .btn-primary { background: #5B7C99; color: #fff; }
        .btn-primary:active { background: #4a6b88; transform: scale(0.97); }
        .btn-secondary { background: #2a2a3a; color: #b8b8c8; }
        .btn-secondary:active { background: #3a3a4a; }
        .password-display { background: #13131c; padding: 14px; border-radius: 12px; color: #6a9bc4; font-family: 'SF Mono', monospace; font-size: 14px; word-break: break-all; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .copy-btn { background: #2a2a3a; border: none; color: #b8b8c8; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .copy-btn:active { background: #5B7C99; color: #fff; }
        .sidebar { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background: #181822; z-index: 200; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 24px 20px; box-shadow: 4px 0 30px rgba(0,0,0,0.7); }
        .sidebar.open { left: 0; }
        .sidebar-logo { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 28px; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; }
        .sidebar-item { padding: 14px 16px; border-radius: 12px; margin-bottom: 6px; cursor: pointer; font-size: 15px; color: #b8b8c8; display: flex; align-items: center; gap: 14px; transition: all 0.15s; font-weight: 500; }
        .sidebar-item svg { width: 18px; height: 18px; }
        .sidebar-item.active { background: #5B7C99; color: #fff; }
        .sidebar-item:active { background: #2a2a3a; }
        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; }
        .overlay.open { display: block; }
        .overview-block { background: #1e1e2a; border-radius: 16px; padding: 18px; margin-bottom: 12px; animation: fadeIn 0.3s ease; }
        .overview-label { font-size: 11px; color: #6a6a7a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .overview-label svg { width: 14px; height: 14px; }
        .overview-value { font-size: 22px; font-weight: 700; color: #fff; }
        .overview-sub { font-size: 14px; color: #b8b8c8; margin-top: 4px; }
        .route-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #2a2a3a; }
        .route-row:last-child { border-bottom: none; padding-bottom: 0; }
        .route-name { font-size: 14px; color: #b8b8c8; display: flex; align-items: center; gap: 8px; }
        .route-time { font-size: 16px; font-weight: 700; color: #6a9bc4; }
        .top-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-bottom: 12px; }
        .weather-card { background: #1e1e2a; border-radius: 16px; padding: 18px; animation: fadeIn 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; }
        .calendar-card { background: #1e1e2a; border-radius: 16px; padding: 14px; animation: fadeIn 0.3s ease; }
        .mini-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .mini-cal-header { text-align: center; font-size: 9px; color: #6a6a7a; font-weight: 600; padding: 2px 0; }
        .mini-cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 5px; font-size: 10px; color: #8a8a9a; font-weight: 500; }
        .mini-cal-day.today { border: 1px solid #5B7C99; animation: pulse 2s infinite; }
        .mini-cal-day.work { background: #5B7C99; color: #fff; font-weight: 700; }
        .mini-cal-title { font-size: 10px; color: #6a6a7a; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 8px; text-align: center; }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .cal-header { text-align: center; font-size: 11px; color: #6a6a7a; font-weight: 600; padding: 6px 0; text-transform: uppercase; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 13px; color: #b8b8c8; cursor: pointer; transition: all 0.15s; font-weight: 500; position: relative; overflow: hidden; }
        .cal-day.empty { cursor: default; }
        .cal-day.today { border: 2px solid #5B7C99; animation: pulse 2s infinite; }
        .cal-day.work { background: #5B7C99; color: #fff; font-weight: 700; }
        .cal-day:active:not(.empty) { transform: scale(0.92); }
        .search-input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid #2a2a3a; background: #1e1e2a; color: #e0e0e0; font-size: 14px; margin-bottom: 12px; font-family: inherit; }
        .search-input:focus { outline: none; border-color: #5B7C99; }
        .search-input::placeholder { color: #6a6a7a; }
        .tag-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
        .tag-chip { padding: 6px 12px; border-radius: 20px; background: #2a2a3a; color: #8ab4d4; font-size: 12px; cursor: pointer; white-space: nowrap; border: 1px solid transparent; transition: all 0.15s; font-weight: 500; }
        .tag-chip.active { background: #5B7C99; color: #fff; border-color: #5B7C99; }
        .note-tag { display: inline-block; background: #2a2a3a; color: #8ab4d4; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 4px; margin-top: 6px; }
        .city-card { background: #1e1e2a; border-radius: 16px; padding: 18px; margin-bottom: 12px; animation: fadeIn 0.3s ease; position: relative; }
        .city-name { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .forecast-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
        .forecast-day { background: #13131c; border-radius: 12px; padding: 12px; min-width: 90px; text-align: center; flex-shrink: 0; }
        .forecast-date { font-size: 11px; color: #6a6a7a; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }
        .forecast-icon { font-size: 24px; margin-bottom: 6px; }
        .forecast-temp { font-size: 14px; font-weight: 700; color: #fff; }
        .forecast-temp-min { font-size: 12px; color: #6a6a7a; margin-top: 2px; }
        .forecast-precip { font-size: 11px; color: #6a9bc4; margin-top: 6px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-card { background: #1e1e2a; border-radius: 14px; padding: 16px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: #fff; }
        .stat-label { font-size: 12px; color: #6a6a7a; margin-top: 4px; font-weight: 500; }
        .chart { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding: 10px 0; }
        .chart-bar { flex: 1; background: linear-gradient(to top, #5B7C99, #6a9bc4); border-radius: 4px 4px 0 0; min-height: 2px; transition: all 0.3s; position: relative; }
        .chart-bar:hover { background: #6a9bc4; }
        .chart-label { font-size: 9px; color: #6a6a7a; text-align: center; margin-top: 4px; }
        .reminder-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #2a2a3a; }
        .reminder-item:last-child { border-bottom: none; }
        .reminder-time { font-size: 13px; color: #6a9bc4; font-weight: 600; }
        .ripple { position: relative; overflow: hidden; }
        .ripple::after { content: ''; position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; background: rgba(255,255,255,0.4); opacity: 0; border-radius: 100%; transform: scale(1) translate(-50%, -50%); transform-origin: 50% 50%; }
        .ripple:active::after { animation: ripple 0.6s ease-out; }
        @keyframes ripple { 0% { transform: scale(0) translate(-50%, -50%); opacity: 0.6; } 100% { transform: scale(30) translate(-50%, -50%); opacity: 0; } }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-logo"><i data-lucide="layout-dashboard"></i> Мой Центр</div>
        <div class="sidebar-item active" data-tab="overview" onclick="showTab('overview')"><i data-lucide="home"></i> Главная</div>
        <div class="sidebar-item" data-tab="schedule" onclick="showTab('schedule')"><i data-lucide="calendar"></i> График</div>
        <div class="sidebar-item" data-tab="notes" onclick="showTab('notes')"><i data-lucide="file-text"></i> Заметки</div>
        <div class="sidebar-item" data-tab="tasks" onclick="showTab('tasks')"><i data-lucide="check-square"></i> Задачи</div>
        <div class="sidebar-item" data-tab="links" onclick="showTab('links')"><i data-lucide="link"></i> Ссылки</div>
        <div class="sidebar-item" data-tab="routes" onclick="showTab('routes')"><i data-lucide="car"></i> Маршруты</div>
        <div class="sidebar-item" data-tab="weather" onclick="showTab('weather')"><i data-lucide="cloud-sun"></i> Погода</div>
        <div class="sidebar-item" data-tab="stats" onclick="showTab('stats')"><i data-lucide="bar-chart-3"></i> Статистика</div>
    </div>

    <div class="topbar">
        <button class="burger ripple" onclick="openSidebar()"><i data-lucide="menu"></i></button>
        <div class="header" id="page-title">Главная</div>
    </div>
    <div id="content"><div class="loading">Загрузка...</div></div>
    <button class="fab ripple" id="fab" onclick="openAddModal()"><i data-lucide="plus"></i></button>
    <div id="modal-container"></div>

    <script>
        const API = 'http://localhost:8000';
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        let currentTab = 'overview';
        let currentWorkMonth = new Date();
        let allNotes = [];
        let allTags = [];
        let activeTag = null;
        let cities = [];

        function refreshIcons() {
            if (window.lucide) lucide.createIcons();
        }

        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }

        async function showTab(tab) {
            currentTab = tab;
            closeSidebar();
            document.querySelectorAll('.sidebar-item').forEach(t => t.classList.remove('active'));
            document.querySelector(`.sidebar-item[data-tab="${tab}"]`).classList.add('active');
            const titles = { overview: 'Главная', schedule: 'График', notes: 'Заметки', tasks: 'Задачи', links: 'Ссылки', routes: 'Маршруты', weather: 'Погода', stats: 'Статистика' };
            document.getElementById('page-title').textContent = titles[tab] || tab;
            const showFab = ['notes', 'tasks', 'links', 'routes', 'weather'].includes(tab);
            document.getElementById('fab').style.display = showFab ? 'flex' : 'none';
            await loadData();
        }

        async function loadData() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Загрузка...</div>';
            try {
                let url = '';
                if (currentTab === 'overview') url = `${API}/today`;
                else if (currentTab === 'schedule') url = `${API}/work_days`;
                else if (currentTab === 'notes') url = `${API}/notes`;
                else if (currentTab === 'tasks') url = `${API}/tasks`;
                else if (currentTab === 'links') url = `${API}/links`;
                else if (currentTab === 'routes') url = `${API}/routes`;
                else if (currentTab === 'weather') url = `${API}/cities`;
                else if (currentTab === 'stats') url = `${API}/stats`;

                const resp = await fetch(url);
                const data = await resp.json();

                if (currentTab === 'overview') { renderOverview(data); return; }
                if (currentTab === 'schedule') { renderSchedule(data); return; }
                if (currentTab === 'notes') { allNotes = data; renderNotes(data); return; }
                if (currentTab === 'weather') { cities = data; renderWeather(data); return; }
                if (currentTab === 'stats') { renderStats(data); return; }

                if (!data || data.length === 0) {
                    content.innerHTML = `<div class="empty"><i data-lucide="inbox"></i><br>Пока ничего нет<br>Нажми «+» чтобы добавить</div>`;
                    refreshIcons();
                    return;
                }

                let html = '';
                if (currentTab === 'tasks') {
                    data.forEach(task => {
                        const doneClass = task.done ? 'task-done' : '';
                        html += `<div class="card">
                            <div class="card-actions">
                                ${!task.done ? `<button class="btn-icon" onclick="markDone(${task.id})"><i data-lucide="check"></i></button>` : ''}
                                <button class="btn-icon" onclick="deleteItem('tasks', ${task.id})"><i data-lucide="trash-2"></i></button>
                            </div>
                            <div class="card-title ${doneClass}">${task.done ? '✅' : '⬜'} ${escapeHtml(task.text)}</div>
                            <div class="card-date"><i data-lucide="calendar"></i> ${formatDate(task.date)}</div>
                        </div>`;
                    });
                } else if (currentTab === 'links') {
                    data.forEach(link => {
                        html += `<div class="card">
                            <div class="card-actions">
                                <button class="btn-icon" onclick="showPassword(${link.id})"><i data-lucide="eye"></i></button>
                                <button class="btn-icon" onclick="deleteItem('links', ${link.id})"><i data-lucide="trash-2"></i></button>
                            </div>
                            <div class="card-title">${escapeHtml(link.title)}</div>
                            <a class="link-url" href="${escapeHtml(link.url)}" target="_blank">${escapeHtml(link.url)}</a>
                            <div class="card-date">Логин: ${link.login || '—'}</div>
                        </div>`;
                    });
                } else if (currentTab === 'routes') {
                    data.forEach(route => {
                        html += `<div class="card">
                            <div class="card-actions">
                                <button class="btn-icon" onclick="showRouteTime(${route.id})"><i data-lucide="clock"></i></button>
                                <button class="btn-icon" onclick="deleteItem('routes', ${route.id})"><i data-lucide="trash-2"></i></button>
                            </div>
                            <div class="card-title">${escapeHtml(route.name)}</div>
                            <div class="card-date">ID: ${route.id}</div>
                        </div>`;
                    });
                }
                content.innerHTML = html;
                refreshIcons();
            } catch (e) {
                content.innerHTML = `<div class="empty">Ошибка загрузки: ${e.message}<br><br>Убедись, что бэкенд запущен (py api.py)</div>`;
            }
        }

        function renderOverview(data) {
            const content = document.getElementById('content');
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const workDays = data.work_days || [];

            let html = '';

            html += `<div class="top-row">
                <div class="weather-card">
                    <div>
                        <div class="overview-label"><i data-lucide="cloud"></i> Погода</div>
                        <div class="overview-value">${escapeHtml(data.weather)}</div>
                        ${data.tomorrow ? `<div style="font-size:12px;color:#6a6a7a;margin-top:6px;">Завтра: ${data.tomorrow.icon} ${data.tomorrow.min}°...${data.tomorrow.max}°, ${data.tomorrow.text}</div>` : ''}
                    </div>
                    <div style="margin-top:14px;font-size:12px;color:#6a6a7a;font-weight:500;">
                        ${escapeHtml(data.currency)}
                    </div>
                </div>
                <div class="calendar-card">
                    <div class="mini-cal-title">${monthName(month).slice(0,3)} ${year}</div>
                    ${renderMiniCalendar(year, month, workDays)}
                </div>
            </div>`;

            if (data.reminders_today && data.reminders_today.length > 0) {
                html += `<div class="overview-block">
                    <div class="overview-label"><i data-lucide="bell"></i> Напоминания на сегодня</div>`;
                data.reminders_today.forEach(r => {
                    const time = r.remind_at.split(' ')[1] || '';
                    html += `<div class="reminder-item">
                        <span class="reminder-time">${time}</span>
                        <span class="route-name">${escapeHtml(r.text)}</span>
                    </div>`;
                });
                html += `</div>`;
            }

            html += `<div class="overview-block">
                <div class="overview-label"><i data-lucide="car"></i> Маршруты</div>
                <div class="route-row">
                    <span class="route-name">🏠 Дом → Работа</span>
                    <span class="route-time">${escapeHtml(data.route_to_work)}</span>
                </div>
                <div class="route-row">
                    <span class="route-name">🏢 Работа → Дом</span>
                    <span class="route-time">${escapeHtml(data.route_to_home)}</span>
                </div>`;
            if (data.extra_routes && data.extra_routes.length > 0) {
                data.extra_routes.forEach(r => {
                    html += `<div class="route-row">
                        <span class="route-name">🚗 ${escapeHtml(r.name)}</span>
                        <span class="route-time">${escapeHtml(r.time)}</span>
                    </div>`;
                });
            }
            html += `</div>`;

            html += `<div class="overview-block">
                <div class="overview-label"><i data-lucide="check-square"></i> Задачи на сегодня</div>`;
            if (data.tasks && data.tasks.length > 0) {
                data.tasks.forEach(t => {
                    html += `<div class="route-row">
                        <span class="route-name">${t.done ? '✅' : '⬜'} ${escapeHtml(t.text)}</span>
                    </div>`;
                });
            } else {
                html += `<div class="overview-sub">нет задач</div>`;
            }
            html += `</div>`;

            content.innerHTML = html;
            refreshIcons();
        }

        function renderMiniCalendar(year, month, workDays) {
            const dayNames = ['П','В','С','Ч','П','С','В'];
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            let startWeekday = firstDay.getDay();
            if (startWeekday === 0) startWeekday = 7;
            startWeekday -= 1;

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

            let html = '<div class="mini-calendar">';
            dayNames.forEach(d => { html += `<div class="mini-cal-header">${d}</div>`; });
            for (let i = 0; i < startWeekday; i++) html += '<div class="mini-cal-day"></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isWork = workDays.includes(dateStr);
                const isToday = dateStr === todayStr;
                let cls = 'mini-cal-day';
                if (isWork) cls += ' work';
                if (isToday) cls += ' today';
                html += `<div class="${cls}">${d}</div>`;
            }
            html += '</div>';
            return html;
        }

        function renderSchedule(workDays) {
            const content = document.getElementById('content');
            const year = currentWorkMonth.getFullYear();
            const month = currentWorkMonth.getMonth();

            let html = `<div class="overview-block">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <button class="btn-icon" onclick="changeMonth(-1)"><i data-lucide="chevron-left"></i></button>
                    <div style="font-size:16px;font-weight:700;color:#fff;">${monthName(month)} ${year}</div>
                    <button class="btn-icon" onclick="changeMonth(1)"><i data-lucide="chevron-right"></i></button>
                </div>
                ${renderCalendar(year, month, workDays, true)}
                <div style="margin-top:16px;font-size:13px;color:#6a6a7a;text-align:center;">
                    Нажми на день, чтобы отметить рабочий
                </div>
            </div>`;
            content.innerHTML = html;
            refreshIcons();
        }

        function renderCalendar(year, month, workDays, interactive) {
            const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            let startWeekday = firstDay.getDay();
            if (startWeekday === 0) startWeekday = 7;
            startWeekday -= 1;

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

            let html = '<div class="calendar">';
            dayNames.forEach(d => { html += `<div class="cal-header">${d}</div>`; });
            for (let i = 0; i < startWeekday; i++) html += '<div class="cal-day empty"></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isWork = workDays.includes(dateStr);
                const isToday = dateStr === todayStr;
                let cls = 'cal-day ripple';
                if (isWork) cls += ' work';
                if (isToday) cls += ' today';
                if (interactive) {
                    html += `<div class="${cls}" onclick="toggleWorkDay('${dateStr}')">${d}</div>`;
                } else {
                    html += `<div class="${cls}">${d}</div>`;
                }
            }
            html += '</div>';
            return html;
        }

        function renderNotes(notes) {
            const content = document.getElementById('content');
            allTags = [...new Set(notes.flatMap(n => n.tags || []))].sort();
            let html = `<input class="search-input" id="note-search" placeholder="🔍 Поиск по заметкам..." oninput="filterNotes()">`;
            html += `<div class="tag-row">`;
            html += `<div class="tag-chip ${activeTag === null ? 'active' : ''}" onclick="setTag(null)">Все</div>`;
            allTags.forEach(tag => {
                html += `<div class="tag-chip ${activeTag === tag ? 'active' : ''}" onclick="setTag('${escapeHtml(tag)}')">#${escapeHtml(tag)}</div>`;
            });
            html += `</div>`;
            html += `<div id="notes-list"></div>`;
            content.innerHTML = html;
            renderNotesList(notes);
        }

        function renderNotesList(notes) {
            const list = document.getElementById('notes-list');
            let filtered = notes;
            const q = document.getElementById('note-search')?.value.toLowerCase() || '';
            if (q) filtered = filtered.filter(n => n.text.toLowerCase().includes(q));
            if (activeTag) filtered = filtered.filter(n => (n.tags || []).includes(activeTag));

            if (!filtered || filtered.length === 0) {
                list.innerHTML = `<div class="empty"><i data-lucide="file-text"></i><br>Ничего не найдено</div>`;
                refreshIcons();
                return;
            }
            let html = '';
            filtered.forEach(note => {
                let tagsHtml = '';
                if (note.tags && note.tags.length > 0) {
                    tagsHtml = '<div style="margin-top:8px;">' + note.tags.map(t => `<span class="note-tag">#${escapeHtml(t)}</span>`).join('') + '</div>';
                }
                html += `<div class="card">
                    <div class="card-actions"><button class="btn-icon" onclick="deleteItem('notes', ${note.id})"><i data-lucide="trash-2"></i></button></div>
                    <div class="card-text">${escapeHtml(note.text)}</div>
                    ${tagsHtml}
                    <div class="card-date">${note.created_at || ''}</div>
                </div>`;
            });
            list.innerHTML = html;
            refreshIcons();
        }

        function setTag(tag) {
            activeTag = tag;
            renderNotes(allNotes);
        }

        function filterNotes() {
            renderNotesList(allNotes);
        }

        function renderWeather(citiesList) {
            const content = document.getElementById('content');
            if (!citiesList || citiesList.length === 0) {
                content.innerHTML = `<div class="empty"><i data-lucide="cloud-sun"></i><br>Городов нет<br>Нажми «+» чтобы добавить</div>`;
                refreshIcons();
                return;
            }
            let html = '';
            citiesList.forEach(city => {
                html += `<div class="city-card" id="city-${city.id}">
                    <div class="card-actions"><button class="btn-icon" onclick="deleteCity(${city.id})"><i data-lucide="trash-2"></i></button></div>
                    <div class="city-name"><i data-lucide="map-pin"></i> ${escapeHtml(city.name)}</div>
                    <div class="loading">Загрузка прогноза...</div>
                </div>`;
            });
            content.innerHTML = html;
            refreshIcons();
            citiesList.forEach(city => loadCityForecast(city.id));
        }

        async function loadCityForecast(cityId) {
            try {
                const resp = await fetch(`${API}/cities/${cityId}/forecast`);
                const data = await resp.json();
                const el = document.getElementById(`city-${cityId}`);
                if (!el) return;
                const dayNames = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
                let html = `<div class="card-actions"><button class="btn-icon" onclick="deleteCity(${cityId})"><i data-lucide="trash-2"></i></button></div>
                    <div class="city-name"><i data-lucide="map-pin"></i> ${escapeHtml(data.name)}</div>
                    <div class="forecast-row">`;
                data.days.forEach((day, i) => {
                    const d = new Date(day.date);
                    const label = i === 0 ? 'Сегодня' : i === 1 ? 'Завтра' : dayNames[d.getDay()];
                    html += `<div class="forecast-day">
                        <div class="forecast-date">${label}</div>
                        <div class="forecast-icon">${day.icon}</div>
                        <div class="forecast-temp">${day.max}°</div>
                        <div class="forecast-temp-min">${day.min}°</div>
                        <div class="forecast-precip">💧${day.precip}%</div>
                    </div>`;
                });
                html += `</div>`;
                el.innerHTML = html;
                refreshIcons();
            } catch (e) {
                console.error(e);
            }
        }

        async function deleteCity(id) {
            if (!confirm('Удалить город?')) return;
            await fetch(`${API}/cities/${id}`, { method: 'DELETE' });
            await loadData();
        }

        function renderStats(data) {
            const content = document.getElementById('content');
            let html = `<div class="stats-grid">
                <div class="stat-card"><div class="stat-value">${data.notes}</div><div class="stat-label">Заметок</div></div>
                <div class="stat-card"><div class="stat-value">${data.tasks_active}</div><div class="stat-label">Активных задач</div></div>
                <div class="stat-card"><div class="stat-value">${data.tasks_done}</div><div class="stat-label">Выполнено</div></div>
                <div class="stat-card"><div class="stat-value">${data.links}</div><div class="stat-label">Ссылок</div></div>
                <div class="stat-card"><div class="stat-value">${data.work_days_month}</div><div class="stat-label">Рабочих дней</div></div>
            </div>`;

            html += `<div class="overview-block">
                <div class="overview-label"><i data-lucide="activity"></i> Активность за 30 дней</div>
                <div class="chart">`;
            const maxVal = Math.max(...data.activity.map(a => a.notes + a.tasks), 1);
            data.activity.forEach(a => {
                const val = a.notes + a.tasks;
                const height = Math.max((val / maxVal) * 100, 2);
                html += `<div class="chart-bar" style="height:${height}%" title="${a.date}: ${a.notes} заметок, ${a.tasks} задач"></div>`;
            });
            html += `</div>
                <div style="display:flex;justify-content:space-between;font-size:10px;color:#6a6a7a;margin-top:4px;">
                    <span>30 дней назад</span><span>Сегодня</span>
                </div>
            </div>`;
            content.innerHTML = html;
            refreshIcons();
        }

        function monthName(m) {
            const names = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            return names[m];
        }

        async function changeMonth(delta) {
            currentWorkMonth.setMonth(currentWorkMonth.getMonth() + delta);
            const y = currentWorkMonth.getFullYear();
            const m = currentWorkMonth.getMonth() + 1;
            const resp = await fetch(`${API}/work_days?year=${y}&month=${m}`);
            const data = await resp.json();
            renderSchedule(data);
        }

        async function toggleWorkDay(dateStr) {
            const y = currentWorkMonth.getFullYear();
            const m = currentWorkMonth.getMonth() + 1;
            const resp = await fetch(`${API}/work_days?year=${y}&month=${m}`);
            const workDays = await resp.json();
            if (workDays.includes(dateStr)) {
                await fetch(`${API}/work_days/${dateStr}`, { method: 'DELETE' });
            } else {
                await fetch(`${API}/work_days`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date: dateStr })
                });
            }
            const resp2 = await fetch(`${API}/work_days?year=${y}&month=${m}`);
            const data2 = await resp2.json();
            renderSchedule(data2);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
            return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
        }

        async function deleteItem(type, id) {
            if (!confirm('Удалить?')) return;
            try {
                await fetch(`${API}/${type}/${id}`, { method: 'DELETE' });
                await loadData();
            } catch (e) { alert('Ошибка удаления: ' + e.message); }
        }

        async function markDone(id) {
            try {
                await fetch(`${API}/tasks/${id}/done`, { method: 'PUT' });
                await loadData();
            } catch (e) { alert('Ошибка: ' + e.message); }
        }

        async function showPassword(id) {
            try {
                const resp = await fetch(`${API}/links/${id}/password`);
                if (!resp.ok) throw new Error('Пароль не найден');
                const data = await resp.json();
                showModal('Пароль', `
                    <div class="password-display">
                        <span>${escapeHtml(data.password)}</span>
                        <button class="copy-btn" onclick="copyPassword('${escapeHtml(data.password)}')">📋</button>
                    </div>
                    <div class="modal-buttons"><button class="btn-secondary" onclick="closeModal()">Закрыть</button></div>`);
            } catch (e) { alert('Ошибка: ' + e.message); }
        }

        function copyPassword(pwd) {
            navigator.clipboard.writeText(pwd).then(() => alert('Пароль скопирован')).catch(() => alert('Не удалось скопировать'));
        }

        async function showRouteTime(id) {
            try {
                const resp = await fetch(`${API}/routes/${id}/time`);
                const data = await resp.json();
                showModal(`Маршрут «${data.name}»`, `<div class="password-display">${escapeHtml(data.time)}</div>
                    <div class="modal-buttons"><button class="btn-secondary" onclick="closeModal()">Закрыть</button></div>`);
            } catch (e) { alert('Ошибка: ' + e.message); }
        }

        function openAddModal() {
            let fields = '';
            if (currentTab === 'notes') {
                fields = `<textarea id="f-text" placeholder="Текст заметки..."></textarea>`;
            } else if (currentTab === 'tasks') {
                fields = `<input id="f-date" type="date" value="${new Date().toISOString().split('T')[0]}">
                          <input id="f-text" placeholder="Текст задачи...">`;
            } else if (currentTab === 'links') {
                fields = `<input id="f-title" placeholder="Название (Google)">
                          <input id="f-url" placeholder="URL (https://...)">
                          <input id="f-login" placeholder="Логин">
                          <input id="f-password" type="password" placeholder="Пароль">`;
            } else if (currentTab === 'routes') {
                fields = `<input id="f-name" placeholder="Название (Дача)">
                          <input id="f-from" placeholder="Откуда (55.025452,82.967158)">
                          <input id="f-to" placeholder="Куда (55.030000,82.950000)">`;
            } else if (currentTab === 'weather') {
                fields = `<input id="f-city" placeholder="Название города (Москва)">`;
            }
            showModal('Добавить', `${fields}
                <div class="modal-buttons">
                    <button class="btn-secondary" onclick="closeModal()">Отмена</button>
                    <button class="btn-primary" onclick="submitAdd()">Сохранить</button>
                </div>`);
        }

        async function submitAdd() {
            try {
                let body = {};
                let url = '';
                if (currentTab === 'notes') {
                    body = { text: document.getElementById('f-text').value };
                    url = `${API}/notes`;
                } else if (currentTab === 'tasks') {
                    body = { date: document.getElementById('f-date').value, text: document.getElementById('f-text').value };
                    url = `${API}/tasks`;
                } else if (currentTab === 'links') {
                    body = {
                        title: document.getElementById('f-title').value,
                        url: document.getElementById('f-url').value,
                        login: document.getElementById('f-login').value || null,
                        password: document.getElementById('f-password').value || null
                    };
                    url = `${API}/links`;
                } else if (currentTab === 'routes') {
                    body = {
                        name: document.getElementById('f-name').value,
                        from_coords: document.getElementById('f-from').value,
                        to_coords: document.getElementById('f-to').value
                    };
                    url = `${API}/routes`;
                } else if (currentTab === 'weather') {
                    body = { name: document.getElementById('f-city').value };
                    url = `${API}/cities`;
                }
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.detail || 'Ошибка');
                }
                closeModal();
                await loadData();
            } catch (e) { alert('Ошибка: ' + e.message); }
        }

        function showModal(title, content) {
            document.getElementById('modal-container').innerHTML = `
                <div class="modal" onclick="if(event.target===this)closeModal()">
                    <div class="modal-content">
                        <div class="modal-title">${title}</div>
                        ${content}
                    </div>
                </div>`;
            refreshIcons();
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        showTab('overview');
    </script>
</body>
</html>
